services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      - app
      - frontend

  frontend:
    build:
      context: ./fluxite-frontend
      args:
          - VITE_API_BASE=https://${API_BASE}
    container_name: frontend
    restart: always

  app:
    build: ./fluxite-api
    container_name: express-app
    restart: always
    env_file:
      - .env
      - fluxite-api/.env
    depends_on:
      redis-server:
        condition: service_healthy

  redis-server:
    image: redis:alpine
    container_name: redis-server
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s