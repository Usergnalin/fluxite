services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      - app
      - frontend

  frontend:
    build:
      context: ./crafted-console-frontend
      args:
          - VITE_API_BASE=https://${API_BASE}
    container_name: frontend
    restart: always

  app:
    build: ./crafted-console-api
    container_name: express-app
    restart: always
    env_file:
      - .env
      - crafted-console-api/.env
    depends_on:
      redis-server:
        condition: service_healthy

  # db:
  #   image: mysql:8.0
  #   container_name: mysql-db
  #   restart: always
  #   env_file:
  #     - crafted-console-api/.env
  #   ports:
  #     - "127.0.0.1:3306:3306"
  #   volumes:
  #     - /var/lib/mysql:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 3s  
  #     timeout: 3s
  #     retries: 20
  #     start_period: 10s

  redis-server:
    image: redis:alpine
    container_name: redis-server
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s